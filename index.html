      const u=(r.url||'').trim(); const href=u?(/^https?:\/\//i.test(u)?u:'https://'+u):'';
      return `<div class="row" style="grid-template-columns:${cols}">
        <input class="in" type="text" value="${esc(r.title)}"${A('references',r.id,'title')} placeholder="Título" aria-label="Título">
        <input class="in" type="text" value="${esc(r.url)}"${A('references',r.id,'url')} placeholder="Link" aria-label="Link">
        <input class="in" type="text" value="${esc(r.tag)}"${A('references',r.id,'tag')} placeholder="Tag" aria-label="Tag">
        <input class="in" type="text" value="${esc(r.note)}"${A('references',r.id,'note')} placeholder="O que aproveitar" aria-label="Nota">
        ${href?`<a class="ref-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${ic('link',14)}Abrir</a>`:'<span></span>'}
        ${rmBtn(` data-action="remove-item" data-c="references" data-i="${r.id}"`,'Remover referência')}
      </div>`;
    }).join('');
    return panel(cols,['Título','Link','Tag','Nota','',''],rows,addBtn('Adicionar referência',' data-action="add-item" data-c="references"'));
  }

  /* ---------- app ---------- */
  function renderApp(keepScroll){
    const y=window.scrollY;
    const p=getProject();
    let main;
    if (!p){
      main=`<div class="page-head"><h1>Sem projectos</h1></div>${empty('home','Crie o primeiro projecto','Use "Novo projecto" na barra lateral para começar o roteiro de produção.','')}`;
    } else {
      const R={resumo:renderResumo,roteiro:renderRoteiro,planos:renderPlanos,chamada:renderChamada,calendario:renderCalendario,tarefas:renderTarefas,equipa:renderEquipa,financeiro:renderFinanceiro,entregaveis:renderEntregaveis,autorizacoes:renderAutorizacoes,equipamento:renderEquipamento,referencias:renderReferencias};
      main=renderPageHead(p)+R[state.activeTab](p);
    }
    const S=SECTIONS[state.activeTab];
    document.getElementById('app').innerHTML=
      `<div class="app${state.ui.menuOpen?' menu-open':''}">${renderSide(p)}<div class="scrim" data-action="close-menu"></div>
        <div class="content"><div class="topbar"><button class="icon-btn" data-action="toggle-menu" aria-label="Abrir menu">${ic('menu',20)}</button><b>${S.title}</b><button class="icon-btn" data-action="open-palette" aria-label="Procurar">${ic('search',18)}</button></div>
        <main class="main" id="main">${main}</main></div></div>`;
    firstRender=false;
    if (saveTimer) setSave('saving');
    window.scrollTo(0, keepScroll===false?0:y);
  }
  function focusNow(sel){
    const el=document.querySelector(sel);
    if (el){ el.focus(); if (el.select && el.type==='text') el.select(); if (el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  }

  function doExport(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='painel-producao-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function doImport(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        if (!parsed||!parsed.projects) throw new Error('formato inválido');
        state=normalizeState(parsed); applyTheme(); renderApp(false); persistNow(); toast('Cópia importada');
      }catch(e){ toast('Não foi possível importar este ficheiro: '+e.message); }
    };
    reader.readAsText(file);
  }

  /* ---------- acções ---------- */
  const FACTORY = {
    'shots': (p,a)=>{
      const dayId=a('data-day'); const prev=p.shots.filter(s=>s.dayId===dayId).slice(-1)[0];
      return {id:uid(), dayId, locId:'', desc:'', type:prev?prev.type:'Plano geral', move:prev?prev.move:'Fixo', kind:prev?prev.kind:'Vídeo', prio:'essencial', done:false};
    },
    'contacts': ()=>({id:uid(), name:'', role:'', type:'equipa', phone:'', email:'', rate:0}),
    'tasks': (p,a)=>({id:uid(), title:'', phase:a('data-phase')||'pré-produção', status:a('data-status')||'em espera', due:'', owner:''}),
    'phases': ()=>({id:uid(), name:'Nova fase', start:'', end:''}),
    'references': ()=>({id:uid(), title:'', url:'', tag:'', note:''}),
    'consents': ()=>({id:uid(), subject:'', type:'pessoa', status:'pendente', notes:''}),
    'equipment': ()=>({id:uid(), item:'', providedBy:'', status:'pendente'}),
    'finance.stages': ()=>({id:uid(), name:'', value:0}),
    'finance.payments': ()=>({id:uid(), label:'Nova tranche', value:0, due:'', paid:false}),
    'finance.expenses': ()=>({id:uid(), desc:'', amount:0, cat:'Outro', stageId:'', date:todayISO()})
  };
  const DESTRUCTIVE = new Set(['remove-day','remove-loc','remove-item','remove-deliv','remove-deliv-cat','remove-crew','delete-project']);
  const REMOVED_MSG = {'remove-day':'Dia removido','remove-loc':'Local removido','remove-crew':'Pessoa retirada da chamada','remove-deliv':'Entregável removido','remove-deliv-cat':'Categoria removida','delete-project':'Projecto removido','remove-item':'Item removido'};

  // devolve false/{skip:true} para não renderizar; {keep,focus} para controlar o render
  function act(action,a){
    const p=getProject();
    if (action==='switch-tab'){ state.activeTab=a('data-tab'); state.ui.menuOpen=false; return {keep:false}; }
    if (action==='toggle-menu'){ state.ui.menuOpen=!state.ui.menuOpen; return {}; }
    if (action==='close-menu'){ state.ui.menuOpen=false; return {}; }
    if (action==='open-palette'){ openPalette(); return {skip:true}; }
    if (action==='toggle-theme'){ state.theme=effectiveTheme()==='dark'?'light':'dark'; applyTheme(); return {}; }
    if (action==='export-data'){ doExport(); state.ui.lastExport=todayISO(); toast('Cópia exportada'); return {}; }
    if (action==='import-data'){ document.getElementById('import-input').click(); return {skip:true}; }
    if (action==='new-project'){ state.ui.addingProject=true; state.ui.menuOpen=true; return {focus:'#new-proj-name'}; }
    if (action==='cancel-new-project'){ state.ui.addingProject=false; return {}; }
    if (action==='confirm-new-project'){
      const name=(document.getElementById('new-proj-name')||{}).value;
      const np=ensureProject({id:uid(), name:(name||'').trim()||'Novo projecto', client:((document.getElementById('new-proj-client')||{}).value||'').trim(), location:((document.getElementById('new-proj-location')||{}).value||'').trim(), period:'', status:'negociação'});
      state.projects.push(np); state.activeProjectId=np.id; state.activeTab='resumo'; state.ui.addingProject=false; state.ui.menuOpen=false;
      toast('Projecto criado'); return {keep:false};
    }
    if (action==='select-project'){ state.activeProjectId=a('data-project'); state.activeTab='resumo'; state.ui.menuOpen=false; return {keep:false}; }
    if (action==='delete-project'){
      if (!p) return false;
      state.projects=state.projects.filter(x=>x.id!==p.id);
      state.activeProjectId=state.projects[0]?state.projects[0].id:''; state.activeTab='resumo'; state.ui.showDetails=false; return {keep:false};
    }
    if (!p) return false;

    switch(action){
      case 'open-call': state.activeTab='chamada'; state.ui.callDay=a('data-day'); state.ui.menuOpen=false; return {keep:false};
      case 'toggle-details': state.ui.showDetails=!state.ui.showDetails; return {};
      case 'toggle-day': { const id=a('data-day'); state.ui.collapsed[id]=!state.ui.collapsed[id]; return {}; }
      case 'collapse-all': p.days.forEach(d=>state.ui.collapsed[d.id]=true); return {};
      case 'expand-all': p.days.forEach(d=>state.ui.collapsed[d.id]=false); return {};
      case 'add-day': {
        const prev=p.days[p.days.length-1];
        const d={id:uid(), label:'Dia '+(p.days.length+1), theme:'', locations:[]};
        if (prev){ d.callTime=prev.callTime; d.wrapTime=prev.wrapTime; d.meetingPoint=prev.meetingPoint; d.emergency=prev.emergency; if(prev.date) d.date=addDays(prev.date,1); }
        p.days.push(ensureDay(d));
        return {focus:`[data-df="theme"][data-day="${d.id}"]`};
      }
      case 'remove-day': { const id=a('data-day'); p.days=p.days.filter(d=>d.id!==id); p.shots=p.shots.filter(s=>s.dayId!==id); return {}; }
      case 'move-day-up': { const i=p.days.findIndex(d=>d.id===a('data-day')); if(i>0){ const t=p.days[i-1]; p.days[i-1]=p.days[i]; p.days[i]=t; } return {}; }
      case 'move-day-down': { const i=p.days.findIndex(d=>d.id===a('data-day')); if(i>=0&&i<p.days.length-1){ const t=p.days[i+1]; p.days[i+1]=p.days[i]; p.days[i]=t; } return {}; }
      case 'add-loc': {
        const d=findDay(p,a('data-day')); if(!d) return false;
        state.ui.collapsed[d.id]=false;
        const l={id:uid(), name:'', period:'manhã', status:'pendente', notes:''}; d.locations.push(l);
        return {focus:`[data-lf="name"][data-loc="${l.id}"]`};
      }
      case 'remove-loc': { const d=findDay(p,a('data-day')); const id=a('data-loc'); if(d){ d.locations=d.locations.filter(l=>l.id!==id); p.shots.forEach(s=>{ if(s.locId===id) s.locId=''; }); } return {}; }
      case 'add-item': {
        const c=a('data-c'); const mk=FACTORY[c]; if(!mk) return false;
        const it=mk(p,a); resolveColl(p,c).push(it);
        return {focus:`[data-i="${it.id}"]:not([type=checkbox])`};
      }
      case 'remove-item': { const r=resolveParent(p,a('data-c')); const id=a('data-i'); r.obj[r.key]=r.obj[r.key].filter(x=>x.id!==id); return {}; }
      case 'toggle-deliverable': { const cat=findBy(p.deliverables.categories,a('data-cat')); if(cat){ const it=findBy(cat.items,a('data-item')); if(it) it.done=!it.done; } return {}; }
      case 'add-deliv-item': {
        const catId=a('data-cat'); const cat=findBy(p.deliverables.categories,catId); const inp=document.getElementById('new-del-'+catId);
        const v=inp?inp.value.trim():''; if(!cat||!v){ if(inp) inp.focus(); return {skip:true}; }
        cat.items.push({id:uid(), label:v, done:false}); return {focus:'#new-del-'+catId};
      }
      case 'remove-deliv': { const cat=findBy(p.deliverables.categories,a('data-cat')); const id=a('data-item'); if(cat) cat.items=cat.items.filter(i=>i.id!==id); return {}; }
      case 'add-deliv-cat': {
        const inp=document.getElementById('new-del-cat'); const v=inp?inp.value.trim():''; if(!v){ if(inp) inp.focus(); return {skip:true}; }
        p.deliverables.categories.push({id:uid(), name:v, items:[]}); return {focus:'#new-del-cat'};
      }
      case 'remove-deliv-cat': { const id=a('data-cat'); p.deliverables.categories=p.deliverables.categories.filter(c=>c.id!==id); return {}; }
      case 'gen-shots': {
        const d=findDay(p,a('data-day')); if(!d) return false;
        const base=[['plano geral (estabelecer o local)','Plano geral','Fixo','Vídeo','essencial'],['pormenores e ambiente','Plano de pormenor','Gimbal','Vídeo','desejável'],['fotografia principal','Foto de ambiente','—','Foto','essencial']];
        let n=0;
        d.locations.forEach(l=>{
          if (!l.name.trim()||p.shots.some(s=>s.locId===l.id)) return;
          base.forEach(b=>{ p.shots.push({id:uid(), dayId:d.id, locId:l.id, desc:l.name+' — '+b[0], type:b[1], move:b[2], kind:b[3], prio:b[4], done:false}); n++; });
        });
        toast(n?`${n} planos criados`:'Todos os locais deste dia já têm planos');
        return {};
      }
      case 'task-left': case 'task-right': {
        const x=findBy(p.tasks,a('data-i')); if(!x) return false;
        const i=TASK_COLS.indexOf(x.status)+(action==='task-right'?1:-1); if(i>=0&&i<TASK_COLS.length) x.status=TASK_COLS[i]; return {};
      }
      case 'task-move': { const x=findBy(p.tasks,a('data-i')); const col=a('data-col'); if(!x||!col||x.status===col) return false; x.status=col; return {}; }
      case 'task-phase': state.ui.taskPhase=a('data-phase'); return {};
      case 'cal-prev': state.ui.calMonth=shiftMonth(state.ui.calMonth||defaultMonth(p),-1); return {};
      case 'cal-next': state.ui.calMonth=shiftMonth(state.ui.calMonth||defaultMonth(p),1); return {};
      case 'cal-today': state.ui.calMonth=todayISO().slice(0,7); return {};
      case 'add-crew': { const d=findDay(p,a('data-day')); if(!d) return false; const c={id:uid(), contactId:'', call:'', note:''}; d.crew.push(c); return {focus:`[data-crew="${c.id}"]`}; }
      case 'crew-all': {
        const d=findDay(p,a('data-day')); if(!d) return false; let n=0;
        p.contacts.filter(c=>c.type==='equipa').forEach(c=>{ if(!d.crew.some(x=>x.contactId===c.id)){ d.crew.push({id:uid(), contactId:c.id, call:'', note:''}); n++; } });
        if (!n) toast(p.contacts.length?'Toda a equipa já está nesta chamada':'Adicione contactos do tipo equipa primeiro');
        return {};
      }
      case 'remove-crew': { const d=findDay(p,a('data-day')); const id=a('data-crew'); if(d) d.crew=d.crew.filter(c=>c.id!==id); return {}; }
      case 'print-call': { const d=findDay(p,a('data-day')); if(!d) return false; document.getElementById('print-area').innerHTML=callSheetHTML(p,d,p.days.indexOf(d)); window.print(); return {skip:true}; }
      case 'copy-call': { const d=findDay(p,a('data-day')); if(!d) return false; copyText(callSheetText(p,d,p.days.indexOf(d))); return {skip:true}; }
      case 'wa-crew': {
        const d=findDay(p,a('data-day')); const c=d&&findBy(d.crew,a('data-crew')); const ct=c&&findBy(p.contacts,c.contactId);
        if (!ct){ toast('Escolha primeiro a pessoa'); return {skip:true}; }
        const num=waNumber(ct.phone);
        if (!num){ toast(`${ct.name||'Esta pessoa'} não tem telefone. Adicione-o em Equipa.`); return {skip:true}; }
        window.open('https://wa.me/'+num+'?text='+encodeURIComponent(crewMessage(p,d,p.days.indexOf(d),c,ct)),'_blank','noopener');
        return {skip:true};
      }
    }
    return false;
  }
  function ensureDay(d){
    d.crew=d.crew||[]; ['date','sunrise','sunset','weather','planB','meetingPoint','mapUrl','emergency','notes'].forEach(k=>{ if(d[k]===undefined) d[k]=''; });
    if (d.callTime===undefined) d.callTime='07:00'; if (d.wrapTime===undefined) d.wrapTime='18:00'; return d;
  }

  function run(action,a){
    const p=getProject();
    const before=p?milestones(p):null;
    const snap=DESTRUCTIVE.has(action)?JSON.stringify(state):null;
    const res=act(action,a);
    if (res===false || (res&&res.skip)) return;
    renderApp(!(res&&res.keep===false));
    scheduleSave();
    if (res&&res.focus) focusNow(res.focus);
    if (snap) toast(REMOVED_MSG[action]||'Removido',{undo:()=>{ state=normalizeState(JSON.parse(snap)); applyTheme(); renderApp(false); persistNow(); }});
    const p2=getProject(); if (before&&p2) checkMilestones(before,p2);
  }

  function applyField(t){
    const p=getProject(); if(!p) return false;
    const val=t.type==='checkbox'?t.checked:t.value;
    if (t.hasAttribute('data-c')){
      const arr=resolveColl(p,t.getAttribute('data-c')); const it=arr&&findBy(arr,t.getAttribute('data-i')); if(!it) return false;
      it[t.getAttribute('data-k')]=t.hasAttribute('data-num')?(Number(val)||0):val; return true;
    }
    if (t.hasAttribute('data-pf')){ p[t.getAttribute('data-pf')]=val; return true; }
    if (t.hasAttribute('data-df')){ const d=findDay(p,t.getAttribute('data-day')); if(!d) return false; d[t.getAttribute('data-df')]=val; return true; }
    if (t.hasAttribute('data-lf')){ const d=findDay(p,t.getAttribute('data-day')); const l=d&&findBy(d.locations,t.getAttribute('data-loc')); if(!l) return false; l[t.getAttribute('data-lf')]=val; return true; }
    if (t.hasAttribute('data-cf')){ const d=findDay(p,t.getAttribute('data-day')); const c=d&&findBy(d.crew,t.getAttribute('data-crew')); if(!c) return false; c[t.getAttribute('data-cf')]=val; return true; }
    return false;
  }

  /* ---------- eventos ---------- */
  const app=document.getElementById('app');
  app.addEventListener('click',e=>{
    const t=e.target.closest('[data-action]');
    if (!t||t.tagName==='SELECT'||t.tagName==='OPTION') return;
    run(t.getAttribute('data-action'),k=>t.getAttribute(k));
  });
  app.addEventListener('input',e=>{
    const t=e.target;
    if (t.tagName==='SELECT'||t.type==='checkbox') return;
    if (applyField(t)){ scheduleSave(); refreshLive(); }
  });
  app.addEventListener('change',e=>{
    const t=e.target; const act0=t.getAttribute('data-action');
    const p=getProject(); const before=p?milestones(p):null;
    if (act0==='set-status'){ if(p) p.status=t.value; renderApp(); scheduleSave(); return; }
    if (act0==='pick-project'){ state.activeProjectId=t.value; state.activeTab='resumo'; renderApp(false); scheduleSave(); return; }
    if (act0==='pick-callday'){ state.ui.callDay=t.value; renderApp(); scheduleSave(); return; }
    const isText=t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type!=='checkbox');
    if (isText){ if(applyField(t)){ scheduleSave(); refreshLive(); } return; }
    if (applyField(t)){
      renderApp(); scheduleSave();
      const p2=getProject(); if(before&&p2) checkMilestones(before,p2);
    }
  });
  app.addEventListener('keydown',e=>{
    if (e.key!=='Enter'||e.isComposing||e.shiftKey) return;
    const t=e.target; const p=getProject();
    if (t.closest&&t.closest('.new-proj-form')&&t.tagName==='INPUT'){ e.preventDefault(); run('confirm-new-project',()=>null); return; }
    if (t.matches&&t.matches('.inline-add input')){ e.preventDefault(); const b=t.parentElement.querySelector('button'); if(b) b.click(); return; }
    if (t.getAttribute&&t.getAttribute('data-lf')==='name'){ e.preventDefault(); const day=t.getAttribute('data-day'); run('add-loc',k=>({'data-day':day})[k]); return; }
    if (p&&t.matches&&t.matches('input[data-c="shots"][data-k="desc"]')){
      const sh=findBy(p.shots,t.getAttribute('data-i')); if(sh){ e.preventDefault(); run('add-item',k=>({'data-c':'shots','data-day':sh.dayId})[k]); }
    }
  });
  // arrastar e largar tarefas
  app.addEventListener('dragstart',e=>{
    const g=e.target.closest&&e.target.closest('[data-drag]'); if(!g) return;
    e.dataTransfer.setData('text/plain',g.getAttribute('data-drag')); e.dataTransfer.effectAllowed='move';
    const card=g.closest('.kcard'); if(card){ if(e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(card,12,12); card.classList.add('dragging'); }
  });
  app.addEventListener('dragend',()=>{ document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')); });
  app.addEventListener('dragover',e=>{ const c=e.target.closest&&e.target.closest('.kcol'); if(c){ e.preventDefault(); c.classList.add('over'); } });
  app.addEventListener('dragleave',e=>{ const c=e.target.closest&&e.target.closest('.kcol'); if(c&&!c.contains(e.relatedTarget)) c.classList.remove('over'); });
  app.addEventListener('drop',e=>{
    const c=e.target.closest&&e.target.closest('.kcol'); if(!c) return; e.preventDefault();
    const id=e.dataTransfer.getData('text/plain'); const col=c.getAttribute('data-col');
    run('task-move',k=>({'data-i':id,'data-col':col})[k]);
  });
  window.addEventListener('afterprint',()=>{ document.getElementById('print-area').innerHTML=''; });
  document.getElementById('import-input').addEventListener('change',e=>{ if(e.target.files&&e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; });

  /* ---------- paleta de comandos (Ctrl/Cmd + K) ---------- */
  const pal={open:false, items:[], idx:0};
  const go1 = o => k => o[k];
  function buildCommands(){
    const p=getProject(); const c=[];
    Object.keys(SECTIONS).forEach(k=>c.push({label:'Ir para '+SECTIONS[k].title, hint:'Navegar', icon:SECTIONS[k].icon, run:()=>run('switch-tab',go1({'data-tab':k}))}));
    if (p){
      const add=(label,tab,c2,icon)=>c.push({label, hint:'Criar', icon:icon||'plus', run:()=>{ state.activeTab=tab; run('add-item',go1({'data-c':c2})); }});
      c.push({label:'Adicionar dia', hint:'Criar', icon:'plus', run:()=>{ state.activeTab='roteiro'; run('add-day',go1({})); }});
      add('Adicionar tarefa','tarefas','tasks'); add('Adicionar contacto','equipa','contacts'); add('Adicionar despesa','financeiro','finance.expenses');
      add('Adicionar referência','referencias','references'); add('Adicionar autorização','autorizacoes','consents'); add('Adicionar item de equipamento','equipamento','equipment');
      p.days.forEach((d,i)=>c.push({label:`Abrir folha de chamada do dia ${i+1}`, hint:d.theme||d.label, icon:'clipboard', run:()=>run('open-call',go1({'data-day':d.id}))}));
    }
    state.projects.filter(x=>!p||x.id!==p.id).forEach(x=>c.push({label:'Abrir projecto '+x.name, hint:'Projectos', icon:'home', run:()=>run('select-project',go1({'data-project':x.id}))}));
    c.push({label:'Novo projecto', hint:'Criar', icon:'plus', run:()=>run('new-project',go1({}))});
    c.push({label:'Exportar cópia de segurança', hint:'Dados', icon:'download', run:()=>run('export-data',go1({}))});
    c.push({label:effectiveTheme()==='dark'?'Mudar para tema claro':'Mudar para tema escuro', hint:'Aspecto', icon:effectiveTheme()==='dark'?'sun':'moon', run:()=>run('toggle-theme',go1({}))});
    return c;
  }
  function renderPalette(){
    const q=strip(document.getElementById('pal-input').value.trim());
    const all=buildCommands();
    pal.items = q ? all.filter(x=>strip(x.label).indexOf(q)>=0||strip(x.hint).indexOf(q)>=0).sort((a,b)=>(strip(a.label).indexOf(q)===0?0:1)-(strip(b.label).indexOf(q)===0?0:1)) : all;
    pal.idx=Math.min(pal.idx,Math.max(0,pal.items.length-1));
    const ul=document.getElementById('pal-list');
    ul.innerHTML = pal.items.length ? pal.items.map((x,i)=>`<li><button data-i="${i}" class="${i===pal.idx?'on':''}">${ic(x.icon,16)}<span>${esc(x.label)}</span><small>${esc(x.hint)}</small></button></li>`).join('') : '<li class="none">Nada encontrado. Experimente outra palavra.</li>';
    const on=ul.querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest'});
  }
  function openPalette(){
    pal.open=true; pal.idx=0;
    const el=document.getElementById('palette'); el.classList.add('open'); el.setAttribute('aria-hidden','false');
    const inp=document.getElementById('pal-input'); inp.value=''; renderPalette(); setTimeout(()=>inp.focus(),0);
  }
  function closePalette(){ pal.open=false; const el=document.getElementById('palette'); el.classList.remove('open'); el.setAttribute('aria-hidden','true'); }
  function runPalette(i){ const it=pal.items[i]; if(!it) return; closePalette(); it.run(); }
  document.getElementById('pal-input').addEventListener('input',()=>{ pal.idx=0; renderPalette(); });
  document.getElementById('pal-list').addEventListener('click',e=>{ const b=e.target.closest('button[data-i]'); if(b) runPalette(+b.getAttribute('data-i')); });
  document.getElementById('palette').addEventListener('mousedown',e=>{ if(e.target.id==='palette') closePalette(); });
  document.addEventListener('keydown',e=>{
    if ((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); pal.open?closePalette():openPalette(); return; }
    if (pal.open){
      if (e.key==='Escape'){ e.preventDefault(); closePalette(); }
      else if (e.key==='ArrowDown'){ e.preventDefault(); pal.idx=Math.min(pal.idx+1,pal.items.length-1); renderPalette(); }
      else if (e.key==='ArrowUp'){ e.preventDefault(); pal.idx=Math.max(pal.idx-1,0); renderPalette(); }
      else if (e.key==='Enter'){ e.preventDefault(); runPalette(pal.idx); }
      return;
    }
    if (e.key==='Escape' && state.ui.menuOpen){ state.ui.menuOpen=false; renderApp(); }
  });

  applyTheme();
  renderApp();
})();
</script>
</body>
</html>
